[profile.default]
src = "src"
test = "test"
out = "out"
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
evm_version = "shanghai"
fs_permissions = [{ access = "none", path = "./" }]
remappings = ["forge-std/=lib/forge-std/src/"]

[rpc_endpoints]
bsc = "https://bsc-dataseed.bnbchain.org"

[profile.default.fuzz]
runs = 64
